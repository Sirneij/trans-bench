name: template_logic_engine
display_name: Logic Programming Engine (Template)
category: logic
description: Template for logic programming systems (Clingo, XSB, Soufflé, etc.)

protocol: subprocess # XSB; or souffle_subprocess, clingo_python, alda_subprocess

timing_phases:
  - id: load_facts
    label: LoadFacts
  - id: execute_query
    label: ExecuteQuery
  - id: write_result
    label: WriteResult

input_format: lp # lp: Prolog/ASP facts; facts: Souffle's edge.facts; pickle: ALDA
modes:
  - right_recursion
  - left_recursion
  - double_recursion

# For verified runs with benchmark.py (docs/EXTENSION_GUIDE.md#making-a-system-ready-for-verified-runs):
query_phase: execute_query  # id of the timing phase that is the query itself
# result_file: <name>_results.csv  # file the connector writes the result to (checked after every run)
rule_extension: .lp # .P (XSB), .dl (Souffle), .da (ALDA)

flags:
  requires_credentials: false

execution: {} # passed to the connector as config['execution']; the shipped connectors find their binaries on PATH
