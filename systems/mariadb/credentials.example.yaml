# Copy to credentials.yaml (gitignored) and adapt. The server must run on this machine: results are
# written by the server with SELECT ... INTO OUTFILE '/tmp/mariadb_results.csv'.
#   mariadb -u "$(whoami)" -e "create database if not exists benchmark"
host: localhost
port: 3306
user: your_os_user        # Homebrew's MariaDB creates an account for the installing OS user
password: ''
database: benchmark
