name: duckdb
display_name: DuckDB
category: db
protocol: duckdb

timing_phases:
  - id: create_table
    label: CreateTable
  - id: load_data
    label: LoadData
  - id: create_index
    label: CreateIndex
  - id: analyze
    label: Analyze
  - id: execute_query
    label: ExecuteQuery
  - id: write_result
    label: WriteResult

input_format: tsv
modes:
  - right_recursion
  - left_recursion
  - double_recursion
rule_extension: .sql

flags:
  requires_credentials: false
  uses_file_db: true
