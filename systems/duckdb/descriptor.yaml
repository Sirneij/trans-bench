name: duckdb
display_name: DuckDB
category: db
protocol: duckdb

timing_phases:
  - id: create_table
    label: CreateTable
  - id: load_data
    label: LoadData
  - id: create_index
    label: CreateIndex
  - id: analyze
    label: Analyze
  - id: execute_query
    label: ExecuteQuery
  - id: write_result
    label: WriteResult

input_format: tsv
modes:
  - right_recursion
  - left_recursion
  - double_recursion
  # double recursion over recurring.tc (DuckDB >= 1.5): each self-reference reads all rows
  # accumulated so far instead of only the previous iteration's rows; the plain
  # double_recursion is incomplete on 7 of the 12 graph families (see docs/SYSTEMS.md)
  - doublerecurring_recursion
query_phase: execute_query
result_file: duckdb_results.csv
rule_extension: .sql

flags:
  requires_credentials: false
  uses_file_db: true
