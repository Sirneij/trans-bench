# Copy to credentials.yaml (gitignored) and adapt. Single node started with
#   cockroach start-single-node --store=<data> --external-io-dir=<extern> --insecure \
#     --listen-addr=localhost:26257 --http-port=26256
dbURL: postgresql://root@localhost:26257/defaultdb?sslmode=disable
# = --external-io-dir of the server, with a trailing slash. The input is copied here for IMPORT,
# and EXPORT writes result chunks to <externalDirectory>tmp/ (removed after every run).
externalDirectory: /absolute/path/to/crdb-extern/
