name: singlestore
display_name: SingleStore
category: db
protocol: singlestore  # engine/connectors/rdbms.py SingleStoreConnector (MySQL wire protocol, mysqlclient)

timing_phases:
  - id: create_table
    label: CreateTable
  - id: load_data
    label: LoadData
  - id: create_index
    label: CreateIndex
  - id: analyze
    label: Analyze
  - id: execute_query
    label: ExecuteQuery
  - id: write_result
    label: WriteResult

input_format: tsv
modes:
  - right_recursion
  - left_recursion
  - double_recursion

query_phase: execute_query
result_file: singlestore_results.csv
rule_extension: .py

flags:
  requires_credentials: true
  supports_analyze_step: true
  class_prefix: SingleStore
  module_prefix: singlestore_rules
