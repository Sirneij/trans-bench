name: mongodb
display_name: MongoDB
category: db
protocol: pymongo

timing_phases:
  - id: create_collection
    label: CreateTable
  - id: load_data
    label: LoadData
  - id: create_index
    label: CreateIndex
  - id: execute_query
    label: ExecuteQuery
  - id: write_result
    label: WriteResult

input_format: tsv
modes:
