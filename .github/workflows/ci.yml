# Static analysis and tests on every push and pull request, as described in
# dev.to/sirneij (Django authentication series): one job, a Python matrix, the same scripts as
# on a laptop.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      - name: Install system libraries
        # mysqlclient (MariaDB and SingleStore driver) builds against the MariaDB client library
        run: sudo apt-get update && sudo apt-get install -y pkg-config libmariadb-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt

      - name: Static analysis
        run: bash scripts/static_validation.sh

      - name: Tests
        # the end-to-end tests run DuckDB in-process; no database server is needed
        run: bash scripts/test.sh
